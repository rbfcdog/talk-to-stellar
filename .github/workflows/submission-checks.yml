name: Synthetic submission checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mocked-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked backend dependencies without lifecycle scripts
        run: npm --prefix backend ci --ignore-scripts
      - name: Run synthetic checks without provider credentials or Node network access
        run: npm --prefix backend run check:submission
